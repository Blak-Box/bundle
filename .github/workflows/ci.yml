name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test -race ./...

      # The library must build and pass under the FIPS 140-3 Go module
      # (GOFIPS140=v1.0.0, CMVP #5247) — the appliance ships in FIPS mode.
      # ML-DSA-87 runs here as a non-validated hedge algorithm.
      - name: test (FIPS 140-3 module)
        run: GOFIPS140=v1.0.0 go test ./...

      # The phase-1 TRUST path (ECDSA-P384 + AES-256-GCM STREAM + ECDH keywrap)
      # must additionally pass the STRICT fips140=only runtime, which rejects
      # every non-approved algorithm. This is what proves the STREAM uses a
      # FIPS-safe random nonce (a counter/deterministic nonce would fail here)
      # and that no approved-path code slipped in a non-validated primitive.
      # ML-DSA-87 is deliberately EXCLUDED: it is not in the validated module
      # (a phase-2 hedge, AU-side) and is not a validated-PQC claim until the
      # module certifies it (~2027).
      #
      # DENY-LIST, NOT ALLOW-LIST (#11). This was a `-run` regex naming test
      # prefixes, which meant any new approved-path test whose name fell
      # outside the list was silently dropped from the strict gate — and a
      # `-run` matching nothing exits 0, so the tier could pass vacuously.
      #
      # It had already happened. Four tests were outside the gate when this was
      # inverted, and they were not obscure ones:
      #
      #   TestEnforced2of2RejectsEcdsaOnly   TestHybridSignEnforced2of2
      #   TestHybridBackwardCompatiblePhase1 TestHybridRejectsTamper
      #
      # — the 2-of-2 dual-signer enforcement tests, i.e. precisely the trust
      # boundary this tier exists to prove. They passed under fips140=only the
      # whole time; they simply were not being run there.
      #
      # Inverted, new tests are covered BY DEFAULT and only deliberate
      # exclusions are enumerated.
      - name: strict FIPS (approved path only)
        run: >-
          GOFIPS140=v1.0.0 GODEBUG=fips140=only
          go test -skip '(MLDSA|ML_DSA)' -v ./... 2>&1 | tee strict-fips.log
          && test "${PIPESTATUS[0]}" -eq 0

      # A gate that runs zero tests exits 0. Assert the tier actually executed
      # something — the failure mode this whole issue is about is a check that
      # silently stops checking.
      - name: assert the strict tier actually ran
        run: |
          set -euo pipefail
          ran=$(grep -c '^--- PASS' strict-fips.log || true)
          echo "strict FIPS tier executed ${ran} tests"
          # Floor, not an exact count: it may only ever be RAISED. If a change
          # drops it, the gate lost coverage and that is the bug, not the floor.
          MIN=40
          if [ "$ran" -lt "$MIN" ]; then
            echo "::error::strict FIPS tier ran ${ran} tests, expected >= ${MIN} — the gate lost coverage"
            exit 1
          fi

      # The appliance is aarch64 (GB10 / DGX OS 7): every shippable binary
      # must cross-compile for it under the FIPS module. Build-plan Sprint-1
      # named this smoke; the Makefile targets alone are not a CI gate.
      - name: cross-compile linux/arm64 (FIPS)
        run: |
          GOOS=linux GOARCH=arm64 GOFIPS140=v1.0.0 go build ./...
          GOOS=linux GOARCH=amd64 GOFIPS140=v1.0.0 go build ./...

      # FIPS provenance is invisible at runtime unless asserted: prove the
      # amd64 build reports the validated module and that a PLAIN build does
      # NOT — so `bundle version` is a trustworthy factory signal, not decor.
      - name: FIPS provenance assertion
        run: |
          set -euo pipefail
          GOFIPS140=v1.0.0 go build -o /tmp/bundle-fips ./cmd/bundle
          /tmp/bundle-fips version
          /tmp/bundle-fips version | grep -qE 'fips140:[[:space:]]*v1\.0\.0' \
            || { echo "::error::FIPS build did not report fips140=v1.0.0"; exit 1; }
          go build -o /tmp/bundle-plain ./cmd/bundle
          /tmp/bundle-plain version | grep -qE 'fips140:[[:space:]]*off' \
            || { echo "::error::plain build unexpectedly reports FIPS — the assertion is meaningless"; exit 1; }
          echo "FIPS provenance is asserted end-to-end"
