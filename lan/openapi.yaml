openapi: 3.1.0
info:
  title: BlakBox receiver — box ↔ desktop LAN surface
  version: "1.0.0"
  description: |
    The HTTP surface the appliance's airlock receiver serves to a paired desktop over the LAN.

    THIS DOCUMENTS WHAT IS IMPLEMENTED, not what is planned. `/v1/app/*` — the single mTLS front
    door the desktop app will eventually use — is deliberately absent because it does not exist.

    THE BOX NEVER INITIATES. Every exchange here is desktop-initiated; the receiver only ever
    answers. That is enforced below the HTTP layer and does not depend on this document:
      * `installNeverInitiateGuard()` poisons `http.DefaultTransport` and `http.DefaultClient`,
        so an outbound request panics rather than succeeding quietly;
      * `SystemCallFilter=~connect:EPERM` in the systemd unit refuses `connect(2)` at the kernel;
      * CI runs a source-level grep gate for outbound primitives and a netns/nft-counter oracle
        that counts off-host SYNs and asserts zero.
    A reader auditing this claim should check those three, not this file.
externalDocs:
  description: Bundle format and predicate types
  url: https://github.com/Blak-Box/bundle/blob/main/SPEC.md

servers:
  - url: https://{box}:8444
    description: |
      The enrolled box on the local network. Default listen address is `:8444`
      (`BOX_RECEIVER_LISTEN`). There is no public deployment and no DNS name is assumed —
      the desktop dials an address it was given at pairing.
    variables:
      box:
        default: box.local

security:
  - mutualTLS: []

paths:
  /v1/healthz:
    get:
      summary: Liveness
      operationId: healthz
      description: |
        Unauthenticated liveness only. Carries no state, no version and no identity —
        deliberately, so an unpaired caller learns nothing about the box from it.
      security: []
      responses:
        "200":
          description: The receiver is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok

  /v1/bundle:
    post:
      summary: Deliver a sealed bundle to the box
      operationId: postBundle
      description: |
        The only ingress. The body is a **deterministic tar stream** whose entries appear in a
        fixed order:

          1. `manifest.dsse`  — the DSSE envelope over an in-toto v1 Statement
          2. `payload.enc`    — the encrypted payload
          3. `MANIFEST.txt`   — optional, trailing, human-readable

        Order is normative. The manifest arrives first so the receiver can decide whether it is
        willing to accept the payload before reading it, rather than buffering an unverified blob.

        The Statement's `predicateType` selects the ingress class, and the receiver matches it
        exactly. That exact match IS the cross-class replay defence: a bundle sealed as one class
        must not be acceptable as another even when correctly signed, which is why the AAD is
        re-derived per type rather than shared.
      requestBody:
        required: true
        content:
          application/x-tar:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Accepted and quarantined for scanning.
        "400":
          description: Malformed tar, wrong entry order, or a missing required entry.
        "409":
          description: |
            Already delivered. Re-delivery of an identical bundle is a conflict rather than a
            silent success, so a duplicate cannot masquerade as a fresh submission.
        "415":
          description: |
            Body was not `application/x-tar` of `manifest.dsse` then `payload.enc`.
        "422":
          description: |
            Well-formed but refused — signature, anchor, predicate type or policy. The receiver
            does not distinguish these to the caller: telling an unauthenticated peer *which*
            check failed is an oracle.
        "500":
          description: Receiver-side failure.

  /v1/export:
    get:
      summary: Collect the outbox
      operationId: getExport
      description: |
        Egress of material the box has already decided to release. Desktop-initiated, like
        everything else here.
      responses:
        "200":
          description: The outbox stream.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "500":
          description: Outbox unavailable.

  /v1/audit/egress:
    get:
      summary: The egress record - what this box served, and every time it refused
      operationId: getAuditEgress
      description: |
        The record behind the desktop's egress transparency panel: every audit row whose action
        starts with `egress.`, newest first, plus totals over the WHOLE log.

        The box's central claim is a negative - it never initiates - and a negative cannot be
        shown with a status light. What can be shown is every time the box ANSWERED, and every
        time it REFUSED. Of the six egress actions the receiver writes, four are refusals, and
        `counts` carries every action, so a caller cannot render "served" without also being
        handed the refusals.

        It reports what the box RECORDED SERVING. It is not proof that nothing else left: the
        kernel's own view, the nftables `blakbox-egress-denied` counter, is not read here.

        Reading this record is itself a crossing and is logged as one
        (`egress.audit_served_lan`), so a caller's own reads appear in later responses. A panel
        that polls must separate its own reads from the exports it exists to show; this route
        does not.
      parameters:
        - name: limit
          in: query
          required: false
          description: |
            How many of the newest matching rows to return. Defaults to 100. A value above 1000
            is clamped to 1000 rather than refused; a missing, non-numeric or non-positive value
            falls back to the default. The whole log is scanned either way, so `counts` and
            `matched` are totals whatever `limit` is.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: |
            The record. A box that has never served anything has no log yet and answers with
            zero counts and no rows - a genuine zero, and a different answer from the 503 below.
          content:
            application/json:
              schema:
                type: object
                required: [schema, read_at, counts, rows, scanned, matched, truncated, malformed]
                properties:
                  schema:
                    type: integer
                    const: 1
                    description: |
                      Body version. A reader that does not recognise it must refuse rather than
                      guess at fields.
                  read_at:
                    type: string
                    format: date-time
                  counts:
                    type: object
                    description: |
                      Every `egress.*` action seen in the whole log, not only those in `rows`. A
                      truncated page must not shrink the totals a panel displays.
                    additionalProperties:
                      type: integer
                  rows:
                    type: array
                    description: The newest `limit` matching rows, newest first.
                    items:
                      type: object
                      required: [ts, actor, action]
                      properties:
                        ts:
                          type: string
                        actor:
                          type: string
                        action:
                          type: string
                        details:
                          type: object
                  scanned:
                    type: integer
                    description: Log lines read.
                  matched:
                    type: integer
                    description: Lines whose action starts with `egress.`.
                  truncated:
                    type: boolean
                    description: |
                      True when `rows` is a page of `matched` rather than all of it, so a screen
                      can say "showing 100 of 4,812" instead of implying it has everything.
                  malformed:
                    type: integer
                    description: |
                      Lines that did not parse. A log with unparseable rows is not a clean log, and
                      a panel that dropped them silently would report a tidier boundary than the box
                      has.
        "503":
          description: |
            Either the receiver is at its concurrency limit (`busy`), or the audit record could not
            be read. The second is NOT the same as having served nothing: the box cannot say what
            it has served, and it answers that way rather than with an empty record.
          content:
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    mutualTLS:
      type: mutualTLS
      description: |
        TLS 1.3 minimum, with `RequireAndVerifyClientCert` against the on-box CA — the desktop
        presents a client certificate that CA issued at pairing, and the box CA certificate is the
        desktop's only trusted root. There is no bearer token and no shared secret: possession of
        an issued key pair IS the authorisation.

        Key agreement pins `SecP384r1MLKEM1024` first (PQ-hybrid, ISM-1917) with classical
        `CurveP384` as fallback. **X25519 variants are excluded**, and not for preference:
        `X25519MLKEM768` panics under `GODEBUG=fips140=only`, so including it would make the
        FIPS-only tier crash rather than degrade.

        `Config.CipherSuites` is not set, because crypto/tls IGNORES it for TLS 1.3.
